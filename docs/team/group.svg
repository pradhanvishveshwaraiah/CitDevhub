  <rect x="30" y="490" width="940" height="14" fill="#78350f"/>
  <line x1="30" y1="490" x2="970" y2="490" stroke="#fde68a" stroke-width="2" opacity="0.6"/>

  <!-- Subtle watermark banner on table -->
