    <!-- Smile -->
    <path d="M 348 260 Q 355 266 362 260" stroke="#881337" stroke-width="1.8" fill="none"/>
    <!-- Blue CIT Lanyard -->
    <path d="M 345 290 L 350 420" stroke="#0284c7" stroke-width="4"/>
    <path d="M 365 290 L 360 420" stroke="#0284c7" stroke-width="4"/>
